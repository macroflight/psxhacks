# Low-level turbulence near EGLL, EGPH and EINN in the stormy weather of
# 2026-10-24 evening (a pilot's "tuning down below 3000 ft" report), with
# frankenweather run through flighttest/fw_replay.py. Flown 2026-10-25.
# Each leg flies along the landing runway's line from 10 nm before the
# airport, or the reverse line if the terrain is too high.
situ = "~/autotest-cruise.situ"
registration = "G-PING"
callsign = "BAN{n}T"
route_airport = "EGLF"
record_s = 150
replay_file = "replay_time.txt"
output_dir = "."
tas_kt = 270
before_nm = 10
check_nm = 15
min_clearance_ft = 300
reverse_if_terrain = true

