# The actual FrankeSim config
# The file format is TOML (https://toml.io/)

[identity]
simulator = "FrankenSim"
router = "router1"

[listen]
port = 10747
rest_api_port = 8080
# wait_for_upstream_welcome = true   # default; set to false to accept clients immediately on start

[log]
traffic = true

[psx]
variables = 'C:\fs\PSX\Variables.txt'

[[upstream]]
host = "127.0.0.1"
name = "My PSX main server"
default = true
port = 20747
# password = "SecretPassword123"   # optional; omit if no password required
# Passwords must use only printable ASCII characters (! through ~).
# No spaces, tabs, or other whitespace are allowed.

[[access]]
display_name = "Any local client"
match_ip = [ "127.0.0.1/32", "192.168.86.34/32" ]
level = "full"

# Example: password-protected access rule.
# match_password must use only printable ASCII characters (! through ~).
# No spaces, tabs, or other whitespace are allowed.
# [[access]]
# display_name = "RemoteWithPassword"
# match_ip = [ "192.168.1.0/24" ]
# match_password = "SecretPassword123"
# level = "full"

[[access]]
display_name = "Ventus"
match_ip = [ "192.168.86.2/32" ]
level = "full"

[[access]]
display_name = "RemoteSim"
match_ip = [ "123.123.123.123/32" ]
level = "full"

[[access]]
display_name = "CDUPAD"
match_ip = [ "192.168.86.8/32" ]
level = "full"

[[check]]
type = "name_regexp"
regexp = '.*PSX .*'
limit_min = 5
limit_max = 5
comment = "There should be exactly 5 PSX main clients connected"

[[check]]
type = "name_regexp"
regexp = '.*BACARS.*'
limit_min = 1
limit_max = 1
comment = "There should be exactly one BACARS"
